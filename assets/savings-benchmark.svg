<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" fill="none">
  <defs>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="820" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>
    <radialGradient id="top-glow" cx="720" cy="40" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-noise" x1="46" y1="0" x2="568" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="65%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="bar-clean" x1="28" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="before-clip">
      <rect x="28" y="94" width="540" height="26" rx="7"/>
    </clipPath>
  </defs>

  <!-- Crisp dark engineering panel with border (high contrast on both GitHub Light and Dark) -->
  <rect x="1" y="1" width="818" height="298" rx="16" fill="url(#panel-bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="818" height="298" rx="16" fill="url(#top-glow)"/>

  <!-- Header -->
  <circle cx="34" cy="30" r="4.5" fill="#2dd4bf"/>
  <text x="48" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Context Relay · Real-World Session Benchmark</text>

  <rect x="572" y="17" width="220" height="25" rx="12.5" fill="#132a3a" stroke="#2dd4bf" stroke-opacity="0.38" stroke-width="1"/>
  <text x="682" y="33.5" text-anchor="middle" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">0-LLM Deterministic Surgery</text>

  <line x1="28" y1="54" x2="792" y2="54" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Column: Before vs After Comparison -->
  <!-- BEFORE block -->
  <text x="28" y="83" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">BEFORE · Raw Bloated Session</text>
  <text x="568" y="83" text-anchor="end" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">443.3k tokens · 199 tool steps</text>

  <g clip-path="url(#before-clip)">
    <rect x="28" y="94" width="16" height="26" fill="#38bdf8"/>
    <rect x="44" y="94" width="524" height="26" fill="url(#bar-noise)"/>
  </g>
  <rect x="28" y="94" width="540" height="26" rx="7" stroke="#fb7185" stroke-opacity="0.35" stroke-width="1"/>
  <text x="306" y="111" text-anchor="middle" fill="#fff1f2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">97% removable noise · verbose logs · progress bars · repeated reads</text>

  <circle cx="33" cy="136" r="3" fill="#fb7185"/>
  <text x="44" y="140" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">Pruned 130 bulky log, progress &amp; repeat-read steps + 20-class redaction</text>

  <!-- AFTER block -->
  <text x="28" y="176" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700">AFTER /fork · Clean Relaunch</text>
  <text x="568" y="176" text-anchor="end" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700">13.0k tokens · -97% reduction</text>

  <rect x="28" y="187" width="540" height="26" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="28" y="187" width="18" height="26" rx="6" fill="url(#bar-clean)"/>
  <text x="58" y="204" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">13.0k</text>
  <text x="103" y="204" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">· 430.3k tokens reclaimed instantly (0-LLM, zero summarization)</text>

  <circle cx="33" cy="230" r="3" fill="#2dd4bf"/>
  <text x="44" y="234" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500">100% verbatim prompts &amp; conclusions + live Git diff + lossless traceback</text>

  <!-- Subtle bottom metadata line -->
  <line x1="28" y1="252" x2="568" y2="252" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="271" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Read-only transcript*.jsonl · Zero .sqlite access · Pure local Node ESM</text>

  <!-- Right Column: 3 Hard Metric KPI Cards -->
  <!-- Card 1: -97% Context Weight -->
  <rect x="590" y="68" width="202" height="62" rx="11" fill="#131f35" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="590" y="80" width="3.5" height="38" rx="1.75" fill="#2dd4bf"/>
  <text x="608" y="99" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23" font-weight="800">-97%</text>
  <text x="778" y="95" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">443k→13k</text>
  <text x="608" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Context Weight</text>

  <!-- Card 2: 0 LLM Tokens Spent -->
  <rect x="590" y="141" width="202" height="62" rx="11" fill="#131f35" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="590" y="153" width="3.5" height="38" rx="1.75" fill="#38bdf8"/>
  <text x="608" y="172" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23" font-weight="800">0</text>
  <text x="778" y="168" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Zero API</text>
  <text x="608" y="191" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">LLM Tokens Spent</text>

  <!-- Card 3: 100% Lossless Traceback -->
  <rect x="590" y="214" width="202" height="62" rx="11" fill="#131f35" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="590" y="226" width="3.5" height="38" rx="1.75" fill="#a78bfa"/>
  <text x="608" y="245" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23" font-weight="800">100%</text>
  <text x="778" y="241" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Verbatim</text>
  <text x="608" y="264" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">Lossless Traceback</text>
</svg>
